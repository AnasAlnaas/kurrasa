[build]
  publish = "."
  # No build step: this is hand-written HTML/CSS/JS. `dist` is staged by
  # publish.ps1 and committed, because Netlify runs no build command here.
  #
  # This key beats the publish directory set in the Netlify UI, so it has to be
  # right: pointing it at "." would ship the build scripts and the .md files.
  # publish.ps1 rewrites it to "." in the copy it stages, so that dragging the
  # dist folder onto app.netlify.com/drop also behaves.

# HTML must revalidate so a deploy is visible immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Engines are versioned by content; safe to cache hard once filenames are hashed.
# Until then keep this at an hour so edits land without a stale-cache surprise.
[[headers]]
  for = "/engines/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
